<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARSA Agent 控制台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#9aa3b2; --accent:#5b9dff; --ok:#3ecf8e;
    --warn:#f0b429; --bad:#ff6b6b; --purple:#b48cff;
    --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.3px}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;
         border:1px solid var(--line);color:var(--dim)}
  .spacer{flex:1}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);
       display:inline-block;margin-right:6px}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.run{background:var(--warn);box-shadow:0 0 8px var(--warn);
           animation:pulse 1.2s infinite}
  .dot.bad{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}

  main{display:grid;grid-template-columns:390px 1fr;gap:0;
       height:calc(100vh - 53px)}
  .col{overflow:auto;padding:16px}
  .left{border-right:1px solid var(--line);background:var(--panel)}
  .right{display:flex;flex-direction:column;gap:12px;overflow:hidden;
         padding:14px 16px}

  .card{background:var(--panel2);border:1px solid var(--line);
        border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);
           text-transform:uppercase;letter-spacing:.8px}

  textarea,input,select{width:100%;background:#12151b;color:var(--fg);
    border:1px solid var(--line);border-radius:7px;padding:8px 10px;
    font:inherit;outline:none}
  textarea{resize:vertical;min-height:92px;font-size:13px}
  textarea:focus,input:focus,select:focus{border-color:var(--accent)}
  label{display:block;font-size:11px;color:var(--dim);margin:8px 0 4px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}

  button{background:var(--accent);color:#08101f;border:none;border-radius:7px;
    padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;
    transition:filter .15s}
  button:hover{filter:brightness(1.12)}
  button:disabled{opacity:.4;cursor:not-allowed;filter:none}
  button.ghost{background:transparent;color:var(--fg);
    border:1px solid var(--line);font-weight:500}
  button.danger{background:var(--bad);color:#1a0505}
  .btnrow{display:flex;gap:8px;margin-top:10px}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .metric{background:#12151b;border:1px solid var(--line);border-radius:7px;
          padding:8px 10px}
  .metric .k{font-size:10px;color:var(--dim);letter-spacing:.5px}
  .metric .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

  .frontier{font-size:12px}
  .frontier .item{padding:7px 0;border-bottom:1px solid var(--line)}
  .frontier .item:last-child{border-bottom:none}
  .frontier .lbl{color:var(--dim);font-size:11px}
  .frontier code{background:#12151b;padding:1px 5px;border-radius:4px;
                 font-family:var(--mono);font-size:12px}
  .tags{margin-top:4px}
  .tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;
       background:#1b2432;color:var(--accent);margin-right:4px}

  .stream{flex:1;overflow:auto;background:#0b0d11;border:1px solid var(--line);
          border-radius:10px;padding:12px 14px;font-family:var(--mono);
          font-size:12.5px;line-height:1.6;white-space:pre-wrap;
          word-break:break-word}
  .ln{padding:1px 0}
  .ln.status{color:var(--dim)}
  .ln.tool{color:var(--accent)}
  .ln.result{color:var(--ok)}
  .ln.err{color:var(--bad)}
  .ln.console{color:var(--warn)}
  .ln.think{color:var(--fg)}
  .ln .pfx{color:var(--purple)}

  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{padding:6px 13px;border-radius:7px;border:1px solid var(--line);
       background:transparent;color:var(--dim);cursor:pointer;font-size:12px}
  .tab.active{background:var(--panel2);color:var(--fg);border-color:var(--accent)}
  .pane{display:none;overflow:auto;flex:1;min-height:0}
  .pane.active{display:block}

  .logview{background:#0b0d11;border:1px solid var(--line);border-radius:10px;
           padding:12px 14px;font-family:var(--mono);font-size:12px;
           white-space:pre-wrap;word-break:break-word;max-height:100%;
           overflow:auto;color:var(--dim)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-size:11px;font-weight:500}
  tr:hover td{background:#1b1f27;cursor:pointer}

  .toolform{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
            gap:8px;margin-bottom:10px}
  .sect{margin-bottom:12px}
  .sect h3{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:500}
  .out{background:#0b0d11;border:1px solid var(--line);border-radius:9px;
       padding:11px 13px;font-family:var(--mono);font-size:12px;
       white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
  .verdict{font-weight:600}
  .verdict.ok{color:var(--ok)} .verdict.warn{color:var(--warn)}
  .verdict.bad{color:var(--bad)}
  .hint{font-size:11px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>

<header>
  <h1>MARSA Agent 控制台</h1>
  <span class="badge" id="agentName">agent</span>
  <span class="spacer"></span>
  <span class="badge"><span class="dot" id="dot"></span><span id="statusText">空闲</span></span>
</header>

<main>
  <!-- ================= 左栏 ================= -->
  <div class="col left">

    <div class="card">
      <h2>启动一次自主研究</h2>
      <label>任务描述（越具体越好）</label>
      <textarea id="task" placeholder="例：用 ramsey_compare 比较 n=44 上的五个算子，各 4 个 seed、8 秒预算；照抄 verdict 与 conclusion。"></textarea>
      <div class="row">
        <div>
          <label>迭代轮数</label>
          <input id="iterations" type="number" value="10" min="1" max="60">
        </div>
        <div>
          <label>项目名（留空自动）</label>
          <input id="project" placeholder="mywork">
        </div>
      </div>
      <div class="btnrow">
        <button id="btnStart">开始运行</button>
        <button id="btnStop" class="danger" disabled>中断</button>
      </div>
      <div class="hint">同一个项目名会延续之前的研究状态。</div>
    </div>

    <div class="card">
      <h2>实时指标</h2>
      <div class="metrics">
        <div class="metric"><div class="k">迭代</div><div class="v" id="mIter">–</div></div>
        <div class="metric"><div class="k">工具调用</div><div class="v" id="mTools">0</div></div>
        <div class="metric"><div class="k">模型轮次</div><div class="v" id="mRounds">0</div></div>
        <div class="metric"><div class="k">耗时</div><div class="v" id="mTime">0s</div></div>
      </div>
      <div id="toolCounts" class="hint"></div>
    </div>

    <div class="card">
      <h2>当前前沿</h2>
      <div class="frontier" id="frontier">加载中…</div>
    </div>

    <div class="card">
      <h2>已装载能力</h2>
      <div id="catalog" class="hint">加载中…</div>
    </div>
  </div>

  <!-- ================= 右栏 ================= -->
  <div class="right">
    <div class="stream" id="stream"><div class="ln status">等待启动…</div></div>

    <div class="tabs">
      <button class="tab active" data-pane="paneTools">确定性工具</button>
      <button class="tab" data-pane="paneLog">研究日志</button>
      <button class="tab" data-pane="paneRuns">历次运行</button>
    </div>

    <!-- 确定性工具 -->
    <div class="pane active" id="paneTools">
      <div class="sect">
        <h3>穷举族（判定性）</h3>
        <div class="toolform">
          <input id="eN" type="number" value="40" placeholder="n">
          <input id="eS" type="number" value="5" placeholder="s">
          <input id="eT" type="number" value="5" placeholder="t">
          <button id="btnEnum">穷举</button>
        </div>
      </div>

      <div class="sect">
        <h3>固定预算搜索</h3>
        <div class="toolform">
          <input id="sN" type="number" value="43" placeholder="n">
          <select id="sOp">
            <option>tabu_focus</option><option>tabu_violation</option>
            <option>tabu_sample</option><option>tabu</option><option>sa</option>
          </select>
          <input id="sBudget" type="number" value="5" placeholder="秒">
          <input id="sSeed" type="number" value="0" placeholder="seed">
          <button id="btnSearch">搜索</button>
        </div>
      </div>

      <div class="sect">
        <h3>算子比较（统计纪律自检）</h3>
        <div class="toolform">
          <input id="cN" type="number" value="44" placeholder="n">
          <input id="cOps" value="tabu_focus,tabu_violation" placeholder="算子,逗号分隔">
          <input id="cSeeds" type="number" value="3" placeholder="seeds">
          <input id="cBudget" type="number" value="5" placeholder="秒">
          <button id="btnCompare">比较</button>
        </div>
        <div class="hint">verdict 为 inconclusive 时代表差距落在种子噪声内，不可宣称优劣。</div>
      </div>

      <div class="sect">
        <h3>验证构造</h3>
        <div class="toolform">
          <input id="vN" type="number" value="38" placeholder="n">
          <input id="vG6" placeholder="graph6">
          <button id="btnVerify">验证</button>
        </div>
      </div>

      <div class="out" id="toolOut">（工具的返回会显示在这里）</div>
    </div>

    <!-- 研究日志 -->
    <div class="pane" id="paneLog">
      <div class="toolform" style="margin-bottom:10px">
        <select id="logSelect"><option value="">— 选择项目 —</option></select>
        <button id="btnLoadLog">加载</button>
      </div>
      <div class="logview" id="logView">（选择项目后加载）</div>
    </div>

    <!-- 历次运行 -->
    <div class="pane" id="paneRuns">
      <div class="toolform" style="margin-bottom:10px">
        <button id="btnRefreshRuns" class="ghost">刷新</button>
      </div>
      <table>
        <thead><tr><th>项目</th><th>日志条数</th><th>最后修改</th></tr></thead>
        <tbody id="runsBody"><tr><td colspan="3" class="hint">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let currentRun = null, es = null;

/* ---------------- 输出分类着色 ---------------- */
function classify(text){
  if (/^\[tool-result\]/.test(text)) return 'result';
  if (/^\[tool\]/.test(text))        return 'tool';
  if (/^\[status\]/.test(text))      return 'status';
  if (/^\[控制台\]/.test(text))      return 'console';
  if (/error|exception|traceback|失败|Error/i.test(text)) return 'err';
  return 'think';
}
function appendLine(text){
  const div = document.createElement('div');
  div.className = 'ln ' + classify(text);
  div.textContent = text;
  $('stream').appendChild(div);
  const s = $('stream');
  s.scrollTop = s.scrollHeight;
}

/* ---------------- 状态灯 ---------------- */
function setStatus(status){
  const dot = $('dot');
  dot.className = 'dot';
  const map = {
    starting:['run','启动中'], running:['run','运行中'],
    done:['on','已完成'], stopped:['','已中断'], error:['bad','出错'], idle:['','空闲']
  };
  const [cls, txt] = map[status] || ['', status];
  if (cls) dot.classList.add(cls);
  $('statusText').textContent = txt;
}

/* ---------------- 指标 ---------------- */
function updateStats(st){
  if (st.iteration !== undefined && st.iterations)
    $('mIter').textContent = st.iteration + '/' + st.iterations;
  if (st.tool_calls !== undefined) $('mTools').textContent = st.tool_calls;
  if (st.model_rounds !== undefined) $('mRounds').textContent = st.model_rounds;
  if (st.elapsed_seconds !== undefined){
    const s = st.elapsed_seconds;
    $('mTime').textContent = s < 60 ? s.toFixed(0)+'s'
      : Math.floor(s/60)+'m'+(s%60).toFixed(0)+'s';
  }
  if (st.tool_counts){
    const entries = Object.entries(st.tool_counts);
    $('toolCounts').textContent = entries.length
      ? entries.sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' ×'+v).join('   ')
      : '';
  }
}

/* ---------------- 启动 / 中断 ---------------- */
async function startRun(){
  const task = $('task').value.trim();
  if (!task){ alert('请先填写任务描述'); return; }
  $('stream').innerHTML = '';
  $('btnStart').disabled = true;
  $('btnStop').disabled = false;
  setStatus('starting');

  const res = await fetch('/api/agent/start', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      task,
      iterations: parseInt($('iterations').value)||10,
      project: $('project').value.trim()
    })
  }).then(r=>r.json());

  if (!res.ok){ appendLine('[控制台] 启动失败: '+(res.error||'未知')); resetButtons(); return; }
  currentRun = res.run_id;
  $('project').value = res.project;
  appendLine('[控制台] 已启动，项目 '+res.project+'，run_id '+res.run_id);

  if (es) es.close();
  es = new EventSource('/api/agent/stream?run_id='+encodeURIComponent(currentRun));
  es.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'line') appendLine(msg.text);
    else if (msg.type === 'stats'){ updateStats(msg); setStatus(msg.status); }
    else if (msg.type === 'end'){
      setStatus(msg.status);
      appendLine('[控制台] 运行结束（'+msg.status+'），研究日志已写入磁盘。');
      es.close(); es = null; resetButtons(); refreshRuns();
    }
  };
  es.onerror = () => { /* 结束时服务端关闭连接，属正常 */ };
}
function resetButtons(){
  $('btnStart').disabled = false;
  $('btnStop').disabled = true;
}
async function stopRun(){
  if (!currentRun) return;
  await fetch('/api/agent/stop', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({run_id: currentRun})
  });
  appendLine('[控制台] 已请求中断…');
}

/* ---------------- 确定性工具 ---------------- */
async function callTool(action, params){
  $('toolOut').textContent = '计算中…';
  const res = await fetch('/api/run', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({action}, params))
  }).then(r=>r.json());
  renderToolResult(res);
}
function renderToolResult(r){
  if (r.error){ $('toolOut').innerHTML =
    '<span class="verdict bad">错误</span>\n'+r.error; return; }
  let head = '';
  const v = r.verdict || r.status || '';
  let cls = 'ok';
  if (v === 'inconclusive' || v === 'unsolved') cls = 'warn';
  if (v === 'error' || v === 'refuted' || v === 'verification_failed') cls = 'bad';
  if (v) head = '<span class="verdict '+cls+'">'+v+'</span>\n';
  const keep = ['n','s','t','solutions','space','seconds','violations',
                'mean','std','margin','noise_floor','winner','ranking',
                'operator','seed','verified','graph6'];
  let body = '';
  keep.forEach(k=>{ if (r[k]!==undefined && r[k]!==null)
    body += k+' = '+JSON.stringify(r[k])+'\n'; });
  if (r.conclusion) body += '\n'+r.conclusion;
  if (r.per_operator) body += '\n\n'+JSON.stringify(r.per_operator,null,2);
  $('toolOut').innerHTML = head + body
    .replace(/&/g,'&amp;').replace(/</g,'&lt;');
}

/* ---------------- 日志 / 历史 ---------------- */
async function loadRuns(){
  const r = await fetch('/api/agent/runs').then(x=>x.json());
  const list = r.projects || [];
  const tb = $('runsBody');
  tb.innerHTML = '';
  if (!list.length){ tb.innerHTML =
    '<tr><td colspan="3" class="hint">还没有运行记录</td></tr>'; return; }
  list.forEach(p=>{
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>'+p.project+'</td><td>'+p.records+
                   '</td><td>'+p.modified+'</td>';
    tr.onclick = () => { $('logSelect').value = p.project; loadLog(); };
    tb.appendChild(tr);
  });
  const sel = $('logSelect');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— 选择项目 —</option>';
  list.forEach(p=>{
    const o = document.createElement('option');
    o.value = p.project; o.textContent = p.project+'（'+p.records+' 条）';
    sel.appendChild(o);
  });
  sel.value = cur;
}
async function loadLog(){
  const proj = $('logSelect').value;
  if (!proj){ $('logView').textContent = '（先选一个项目）'; return; }
  $('logView').textContent = '加载中…';
  const r = await fetch('/api/agent/log?project='+encodeURIComponent(proj))
    .then(x=>x.json());
  $('logView').textContent = r.log || '（空）';
  switchPane('paneLog');
}
function refreshRuns(){ loadRuns(); }

/* ---------------- 标签切换 ---------------- */
function switchPane(id){
  document.querySelectorAll('.tab').forEach(t=>
    t.classList.toggle('active', t.dataset.pane === id));
  document.querySelectorAll('.pane').forEach(p=>
    p.classList.toggle('active', p.id === id));
}
document.querySelectorAll('.tab').forEach(t=>
  t.onclick = () => switchPane(t.dataset.pane));

/* ---------------- 初始化 ---------------- */
async function init(){
  const st = await fetch('/api/state').then(r=>r.json());
  if (st.agent) $('agentName').textContent = st.agent;

  const f = $('frontier');
  f.innerHTML = '';
  Object.entries(st.frontier || {}).forEach(([name,d])=>{
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<div class="lbl">'+name+'</div>'
      + '<code>'+d.lower+' ≤ '+name+' ≤ '+d.upper+'</code>'
      + '<div class="tags">'+(d.open_targets||[]).map(x=>
          '<span class="tag">开放 n='+x+'</span>').join('')+'</div>';
    f.appendChild(div);
  });

  const c = st.catalog || {};
  $('catalog').innerHTML =
    '<div>工具 '+(c.tools||[]).length+' 个 &nbsp; 技能 '
    +(c.skills||[]).length+' 份 &nbsp; 人格 '
    +(c.agents||[]).length+' 个</div>'
    + (c.tools||[]).map(t=>'<div>· '+t.name+'</div>').join('');

  loadRuns();
}

/* ---------------- 事件绑定 ---------------- */
$('btnStart').onclick = startRun;
$('btnStop').onclick = stopRun;
$('btnLoadLog').onclick = loadLog;
$('btnRefreshRuns').onclick = refreshRuns;
$('btnEnum').onclick = () => callTool('enumerate', {
  n:+$('eN').value, s:+$('eS').value, t:+$('eT').value });
$('btnSearch').onclick = () => callTool('search', {
  n:+$('sN').value, operator:$('sOp').value,
  budget:+$('sBudget').value, seed:+$('sSeed').value });
$('btnCompare').onclick = () => callTool('compare', {
  operators:$('cOps').value.split(',').map(x=>x.trim()).filter(Boolean),
  n:+$('cN').value, seeds:+$('cSeeds').value, budget:+$('cBudget').value });
$('btnVerify').onclick = () => callTool('verify', {
  n:+$('vN').value, graph6:$('vG6').value });

init();
</script>
</body>
</html>
