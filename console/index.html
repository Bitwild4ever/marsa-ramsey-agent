<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARSA 构造搜索控制台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#9aa3b2; --accent:#5b9dff; --ok:#3ecf8e;
    --warn:#f0b429; --bad:#ff6b6b; --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:20px 26px;border-bottom:1px solid var(--line);
         display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:19px;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:13px}
  main{padding:22px 26px;display:grid;gap:20px;
       grid-template-columns:minmax(0,1fr);max-width:1180px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         padding:18px 20px}
  .panel h2{margin:0 0 12px;font-size:14px;color:var(--dim);
            font-weight:600;letter-spacing:.6px;text-transform:uppercase}
  .bounds{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}
  .bound{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
         padding:10px 16px;min-width:150px}
  .bound .k{color:var(--dim);font-size:12px}
  .bound .v{font:600 22px var(--mono);margin-top:2px}
  .note{color:var(--dim);font-size:13px;margin:8px 0 0}
  .targets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
        border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip.open{border-color:var(--ok);color:var(--ok)}
  form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
        border-radius:7px;padding:7px 10px;font:14px var(--mono);min-width:80px}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  button.run{background:var(--accent);color:#08101f;border:0;border-radius:8px;
        padding:9px 20px;font-weight:700;font-size:14px;cursor:pointer}
  button.run:disabled{opacity:.5;cursor:progress}
  #result{margin-top:16px}
  .verdict{display:inline-block;padding:3px 12px;border-radius:999px;
        font-size:13px;font-weight:700}
  .v-ok{background:rgba(62,207,142,.15);color:var(--ok);border:1px solid var(--ok)}
  .v-bad{background:rgba(255,107,107,.13);color:var(--bad);border:1px solid var(--bad)}
  .v-warn{background:rgba(240,180,41,.13);color:var(--warn);border:1px solid var(--warn)}
  .concl{margin:10px 0 12px;font-size:14px}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
      padding:12px;overflow:auto;font:12.5px/1.55 var(--mono);max-height:340px;margin:0}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
      gap:8px;margin-top:12px}
  .kv div{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
      padding:7px 11px;font-size:13px}
  .kv b{color:var(--dim);font-weight:500;display:block;font-size:11px}
  .kv span{font-family:var(--mono)}
  .cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
  .item .nm{font:600 13px var(--mono);color:var(--accent);margin-bottom:4px}
  .item .ds{color:var(--dim);font-size:12.5px;line-height:1.5}
  .hint{color:var(--dim);font-size:12.5px;margin-top:10px}
  .err{color:var(--bad)}
  code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<header>
  <h1>MARSA 构造搜索控制台</h1>
  <span class="sub">确定性计算内核 · 不调用任何大模型 · 无需 API key</span>
</header>

<main>
  <section class="panel">
    <h2>当前边界</h2>
    <div id="frontier"></div>
  </section>

  <section class="panel">
    <h2>跑一次实验</h2>
    <form id="runform">
      <label>动作
        <select id="action">
          <option value="enumerate">穷举对称族（判定性）</option>
          <option value="search">搜索（尽力而为）</option>
          <option value="verify">验证一份构造</option>
        </select>
      </label>
      <label>n <input id="n" type="number" value="38" min="4" max="62"></label>
      <label>s <input id="s" type="number" value="5" min="2" max="10"></label>
      <label>t <input id="t" type="number" value="5" min="2" max="10"></label>
      <label class="only-search">算子
        <select id="operator"></select>
      </label>
      <label class="only-search">预算(秒) <input id="budget" type="number" value="5" min="0.1" max="120" step="0.5"></label>
      <label class="only-search">种子 <input id="seed" type="number" value="0"></label>
      <label class="only-verify" style="flex:1;min-width:280px">graph6
        <input id="graph6" type="text" placeholder="从上一次搜索结果里粘贴">
      </label>
      <button class="run" type="submit" id="go">运行</button>
    </form>
    <div class="hint">
      提示：<b>穷举</b>给出的是判定（存在 / 不存在），<b>搜索</b>只给出"这一预算内的最好结果"。
      想验证一条构造是否存在，优先用穷举；穷举不了再搜。
    </div>
    <div id="result"></div>
  </section>

  <section class="panel">
    <h2>已装载的能力</h2>
    <div id="catalog" class="cat"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let STATE = null;

function verdictClass(s){
  if (["exists","verified","solved"].includes(s)) return "v-ok";
  if (["none_exist","refuted","verification_failed"].includes(s)) return "v-bad";
  return "v-warn";
}

function renderFrontier(f){
  const el = $("frontier");
  el.innerHTML = "";
  for (const [name, d] of Object.entries(f)){
    const box = document.createElement("div");
    box.innerHTML = `
      <div class="bounds">
        <div class="bound"><div class="k">${name} 下界</div><div class="v">${d.lower}</div></div>
        <div class="bound"><div class="k">${name} 上界</div><div class="v">${d.upper}</div></div>
        <div class="bound"><div class="k">开放靶子</div>
          <div class="v">${d.open_targets.map(x=>"n="+x).join(" / ")}</div></div>
      </div>
      <p class="note">${d.note}</p>
      <p class="note">${d.why}</p>
      ${d.check ? `<p class="note">${d.check}</p>` : ""}
      <div class="targets"></div>`;
    const tg = box.querySelector(".targets");
    const cands = [d.lower, ...d.open_targets, d.upper, 38, 41];
    [...new Set(cands)].sort((a,b)=>a-b).forEach(v=>{
      const c = document.createElement("span");
      c.className = "chip" + (d.open_targets.includes(v) ? " open" : "");
      c.textContent = "n=" + v + (d.open_targets.includes(v) ? " ★" : "");
      c.title = d.open_targets.includes(v) ? "这是开放靶子" : "已定或用于标定";
      c.onclick = () => { $("n").value = v; };
      tg.appendChild(c);
    });
    el.appendChild(box);
  }
}

function renderCatalog(c){
  const el = $("catalog");
  el.innerHTML = "";
  const groups = [
    ["工具 · 确定性计算", c.tools.map(t=>({n:t.name, d:t.description}))],
    ["技能 · 方法论",     c.skills.map(t=>({n:t.name, d:t.description}))],
    ["Agent 人格",        c.agents.map(t=>({n:t.name, d:t.title}))],
  ];
  for (const [title, items] of groups){
    const h = document.createElement("div");
    h.style.gridColumn = "1/-1";
    h.innerHTML = `<h2 style="margin:6px 0 0">${title}（${items.length}）</h2>`;
    el.appendChild(h);
    if (!items.length){
      const d = document.createElement("div");
      d.className = "item";
      d.innerHTML = `<div class="ds">未找到 —— 先运行 <code>ramsey-pack/install.py</code></div>`;
      el.appendChild(d);
      continue;
    }
    for (const it of items){
      const d = document.createElement("div");
      d.className = "item";
      d.innerHTML = `<div class="nm">${it.n}</div><div class="ds">${it.d||""}</div>`;
      el.appendChild(d);
    }
  }
}

function syncForm(){
  const a = $("action").value;
  document.querySelectorAll(".only-search").forEach(e=>{
    e.style.display = (a === "search") ? "flex" : "none"; });
  document.querySelectorAll(".only-verify").forEach(e=>{
    e.style.display = (a === "verify") ? "flex" : "none"; });
}

function renderResult(r){
  const el = $("result");
  if (!r.ok){
    el.innerHTML = `<p class="err">出错：${r.error||"未知错误"}</p>`;
    return;
  }
  const skip = new Set(["ok","action","conclusion","status","graph6","witness",
                        "connection_set"]);
  let kv = "";
  for (const [k,v] of Object.entries(r)){
    if (skip.has(k) || v === null || v === undefined) continue;
    kv += `<div><b>${k}</b><span>${v}</span></div>`;
  }
  const g6 = r.graph6
    ? `<div style="margin-top:12px"><b style="color:var(--dim);font-size:11px">graph6（可复制回去验证）</b>
       <pre>${r.graph6}</pre></div>` : "";
  const cs = r.connection_set
    ? `<div><b>连接集</b><span>${JSON.stringify(r.connection_set)}</span></div>` : "";
  el.innerHTML = `
    <div><span class="verdict ${verdictClass(r.status)}">${r.status}</span></div>
    <p class="concl">${r.conclusion||""}</p>
    <div class="kv">${kv}${cs}</div>${g6}`;
}

async function load(){
  const s = await (await fetch("/api/state")).json();
  STATE = s;
  renderFrontier(s.frontier);
  renderCatalog(s.catalog);
  const op = $("operator");
  op.innerHTML = "";
  s.operators.forEach(o=>{
    const t = document.createElement("option");
    t.value = o; t.textContent = o;
    if (o === "tabu_focus") t.selected = true;
    op.appendChild(t);
  });
  syncForm();
}

$("action").addEventListener("change", syncForm);

$("runform").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const btn = $("go");
  btn.disabled = true;
  $("result").innerHTML = `<p class="hint">运行中…（搜索按预算耗时）</p>`;
  const a = $("action").value;
  const body = { action:a, n:+$("n").value, s:+$("s").value, t:+$("t").value };
  if (a === "search"){
    body.operator = $("operator").value;
    body.budget = +$("budget").value;
    body.seed = +$("seed").value;
  }
  if (a === "verify") body.graph6 = $("graph6").value;
  try{
    const r = await (await fetch("/api/run", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)})).json();
    renderResult(r);
  }catch(e){
    renderResult({ok:false, error:String(e)});
  }finally{
    btn.disabled = false;
  }
});

load();
</script>
</body>
</html>
